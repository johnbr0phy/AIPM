const phases = [
  { id: 1, name: "Foundations", color: "purple", sessions: [
    { id: 1, title: "LLM Architecture & API Fundamentals", desc: "How LLMs work, tokens, parameters", duration: "1 hour", topics: ["What LLMs actually do (next-token prediction)", "Tokens: the atomic unit of LLM processing", "Temperature and sampling parameters", "Context windows and their tradeoffs", "The API mental model: inputs, outputs, costs"], exercises: ["Temperature slider demo", "System prompts demo", "Token counting", "Hallucination demo"], outcome: "Confidently make API calls and explain temperature/tokens to stakeholders." },
    { id: 2, title: "Prompt Engineering Patterns", desc: "Few-shot, chain-of-thought, structured output", duration: "1 hour", topics: ["Few-shot learning", "Chain-of-thought reasoning", "Structured outputs (JSON)", "Extended Thinking in Claude 4.5"], exercises: ["Few-shot examples", "Chain-of-thought prompts", "Structured output practice"], outcome: "Write prompts that consistently produce high-quality outputs." },
    { id: 3, title: "Embeddings & Semantic Similarity", desc: "Text → numbers, meaning positions", duration: "1 hour", topics: ["What embeddings are", "Semantic similarity", "Cosine similarity"], exercises: ["TensorFlow Embedding Projector", "API comparison"], outcome: "Understand how machines 'understand' meaning." },
    { id: 4, title: "Vector Databases Deep Dive", desc: "Storing and searching embeddings", duration: "1 hour", topics: ["Why embeddings need special databases", "Indexing strategies", "Pinecone vs Chroma vs pgvector"], exercises: ["Explore Pinecone console", "Similarity search"], outcome: "Choose the right vector database for your use case." },
    { id: 5, title: "Document Processing & Chunking", desc: "Breaking documents into pieces", duration: "1 hour", topics: ["Why chunking matters", "Chunk size tradeoffs", "Overlap strategies"], exercises: ["Chunk size comparison", "Metadata tagging"], outcome: "Process documents optimally for RAG." },
    { id: 6, title: "Building Your First RAG Pipeline", desc: "Retrieval Augmented Generation", duration: "1 hour", topics: ["The RAG architecture pattern", "End-to-end flow", "Failure modes"], exercises: ["RAG walkthrough", "Debug failures"], outcome: "Build a working RAG system." }
  ]},
  { id: 2, name: "Agentic AI", color: "blue", sessions: [
    { id: 7, title: "Function Calling & Tool Use", desc: "LLMs calling external APIs", duration: "1 hour", topics: ["Function calling syntax", "Tool definitions", "Error handling"], exercises: ["Define tools", "See Claude decide when to use tools"], outcome: "Create agents that interact with external systems." },
    { id: 8, title: "ReAct Agents & Extended Thinking", desc: "Reason → Act → Observe", duration: "1 hour", topics: ["ReAct pattern", "Extended Thinking", "Thinking budget"], exercises: ["ReAct demo", "Extended Thinking API"], outcome: "Implement agents that reason before acting." },
    { id: 9, title: "Memory Systems for Stateful Agents", desc: "Short-term, long-term memory", duration: "1 hour", topics: ["Memory types", "Conversation memory", "Persistent memory"], exercises: ["Implement memory", "Cross-session persistence"], outcome: "Build agents that remember context." },
    { id: 10, title: "Advanced RAG Patterns", desc: "Hybrid search, reranking", duration: "1 hour", topics: ["Hybrid search", "Reranking", "Query expansion"], exercises: ["Implement hybrid search", "Add reranking"], outcome: "Significantly improve RAG quality." },
    { id: 11, title: "Corrective & Autonomous RAG", desc: "Self-checking, validation", duration: "1 hour", topics: ["Self-RAG pattern", "Corrective RAG", "Confidence scoring"], exercises: ["Implement Self-RAG", "Build confidence scoring"], outcome: "Create self-validating RAG systems." },
    { id: 12, title: "When RAG Fails — Agentic Search", desc: "When simpler approaches win", duration: "1 hour", topics: ["RAG's hidden costs", "Agentic search pattern", "Claude Code case study"], exercises: ["Compare RAG vs agentic search", "Build agentic search loop"], outcome: "Know when RAG is overkill." },
    { id: 13, title: "Voice & Multimodal Agents", desc: "Images, audio as inputs", duration: "1 hour", topics: ["Image input to Claude", "Multimodal prompts"], exercises: ["Analyze screenshots", "Voice concepts"], outcome: "Work with images and audio." }
  ]},
  { id: 3, name: "Multi-Agent Systems", color: "emerald", sessions: [

    { id: 15, title: "CrewAI for Role-Based Teams", desc: "Agents with roles and goals", duration: "1 hour", topics: ["CrewAI framework", "Agent roles", "Task handoffs"], exercises: ["Define roles", "Observe collaboration"], outcome: "Use CrewAI to coordinate agents." },
    { id: 16, title: "LangGraph for Complex Workflows", desc: "State machines for agents", duration: "1 hour", topics: ["Graph-based workflows", "Conditional branching", "Human-in-the-loop"], exercises: ["Implement branching", "Add human checkpoints"], outcome: "Create complex workflows with LangGraph." },
    { id: 17, title: "OpenAI Agents SDK Deep Dive", desc: "OpenAI's approach to agents", duration: "1 hour", topics: ["OpenAI patterns", "Comparing approaches"], exercises: ["Explore OpenAI patterns", "Vendor tradeoffs"], outcome: "Master OpenAI's agent tools." },
    { id: 18, title: "Google ADK for Enterprise", desc: "Google's Agent Development Kit", duration: "1 hour", topics: ["Google ADK", "Enterprise requirements"], exercises: ["Explore Google's approach"], outcome: "Build enterprise agents with Google ADK." },

    { id: 21, title: "Safety, Guardrails & Responsible AI", desc: "Preventing misuse and bias", duration: "1 hour", topics: ["Input/output guardrails", "Bias detection"], exercises: ["Implement guardrails", "Bias detection"], outcome: "Ship AI features responsibly." },

    { id: 24, title: "Fine-tuning vs RAG vs Agentic Search", desc: "Decision framework", duration: "1 hour", topics: ["The four options", "Decision flowchart", "Hybrid strategies"], exercises: ["Walk through framework", "Cost/benefit analysis"], outcome: "Make informed build decisions." },
    { id: 25, title: "Capstone Integration", desc: "Put it all together", duration: "2 hours", topics: ["Full feature design", "Build vs buy", "Roadmap"], exercises: ["Design full feature", "Create roadmap"], outcome: "Ship a production-ready AI feature." }

const navSections = [
  { id: 'overview', label: 'Overview' },
  { id: 'who', label: 'Who This Is For' },
  { id: 'learn', label: 'What You\'ll Learn' },
  { id: 'personalization', label: 'How It Adapts' },
  { id: 'curriculum', label: 'Curriculum' },
  { id: 'prereqs', label: 'Prerequisites' },
  { id: 'start', label: 'Get Started' }
];

const sessionDetailSections = [
  { id: 'session-overview', label: 'Overview' },
  { id: 'session-outcome', label: 'Outcome' },
  { id: 'session-topics', label: 'Topics' },
  { id: 'session-exercises', label: 'Exercises' }
];

function SessionDetail({ session, phase, onBack, onNavigate, allSessions }) {
  const colorMap = {
    purple: { bg: 'bg-purple-100', text: 'text-purple-700', border: 'border-purple-200' },
    blue: { bg: 'bg-blue-100', text: 'text-blue-700', border: 'border-blue-200' },
    emerald: { bg: 'bg-emerald-100', text: 'text-emerald-700', border: 'border-emerald-200' },
    amber: { bg: 'bg-amber-100', text: 'text-amber-700', border: 'border-amber-200' }
  };
  const colors = colorMap[phase.color];
  const prev = allSessions.find(s => s.session.id === session.id - 1);
  const next = allSessions.find(s => s.session.id === session.id + 1);

  return (
    <>
      <button onClick={onBack} className="flex items-center gap-2 text-slate-500 hover:text-purple-600 mb-6">
        <ArrowLeft className="w-4 h-4" /><span className="text-sm">Back to Course Overview</span>
      </button>
      <section id="session-overview" className="mb-8 scroll-mt-20">
        <div className="flex items-center gap-3 mb-3">
          <span className={`text-xs font-semibold px-3 py-1 rounded-full ${colors.bg} ${colors.text}`}>Phase {phase.id}: {phase.name}</span>
          <span className="text-sm text-slate-500">Session {session.id} of 25</span>
        </div>
        <h1 className="text-3xl font-bold text-slate-900 mb-2">{session.title}</h1>
        <p className="text-lg text-slate-600">{session.desc}</p>
        <div className="mt-4 flex items-center gap-4 text-sm text-slate-500">
          <span>{session.duration}</span>
          <span>{session.topics?.length || 0} topics</span>
          <span>{session.exercises?.length || 0} exercises</span>
        </div>
      </section>
      {session.outcome && (
        <section id="session-outcome" className={`mb-8 p-4 rounded-xl ${colors.bg} ${colors.border} border scroll-mt-20`}>
          <div className="flex items-start gap-3">
            <CheckCircle className={`w-5 h-5 ${colors.text} mt-0.5 flex-shrink-0`} />
            <div><div className={`font-semibold ${colors.text} mb-1`}>By the end of this session</div><p className="text-slate-700">{session.outcome}</p></div>
          </div>
        </section>
      )}
      {session.topics && (
        <section id="session-topics" className="mb-8 scroll-mt-20">
          <h2 className="text-xl font-semibold text-slate-900 mb-4">What You'll Learn</h2>
          <div className="space-y-2">
            {session.topics.map((topic, i) => (
              <div key={i} className="flex items-start gap-3 p-3 bg-white rounded-lg border border-slate-200">
                <span className="text-sm font-mono text-slate-400 w-6">{i + 1}.</span>
                <span className="text-slate-700">{topic}</span>
              </div>
            ))}
          </div>
        </section>
      )}
      {session.exercises && (
        <section id="session-exercises" className="mb-8 scroll-mt-20">
          <h2 className="text-xl font-semibold text-slate-900 mb-4">Hands-On Exercises</h2>
          <div className="space-y-2">
            {session.exercises.map((ex, i) => (
              <div key={i} className="flex items-start gap-3 p-3 bg-white rounded-lg border border-slate-200">
                <Zap className="w-4 h-4 text-amber-500 mt-1 flex-shrink-0" />
                <span className="text-slate-700">{ex}</span>
              </div>
            ))}
          </div>
        </section>
      )}
      <div className="flex items-center justify-between pt-8 border-t border-slate-200 gap-4">
        {prev ? <button onClick={() => onNavigate(prev.session, prev.phase)} className="text-sm text-slate-600 hover:text-purple-600 flex items-center gap-2"><ArrowLeft className="w-4 h-4" />Session {prev.session.id}</button> : <div />}
        {next ? <button onClick={() => onNavigate(next.session, next.phase)} className="text-sm text-slate-600 hover:text-purple-600">Session {next.session.id} →</button> : <div />}
      </div>
    </>
  );
}

function CourseSite() {
  const [selectedSession, setSelectedSession] = useState(null);
  const [selectedPhase, setSelectedPhase] = useState(null);
  const [expandedPhases, setExpandedPhases] = useState({1: true});
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

  const allSessions = phases.flatMap(phase => phase.sessions.map(session => ({ session, phase })));
  const scrollTo = (id) => document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
  const togglePhase = (id) => setExpandedPhases(prev => ({ ...prev, [id]: !prev[id] }));

██╔══██║██║    ██╔═══╝ ██║╚██╔╝██║
██║  ██║██║    ██║     ██║ ╚═╝ ██║
╚═╝  ╚═╝╚═╝    ╚═╝     ╚═╝     ╚═╝`}</pre>
